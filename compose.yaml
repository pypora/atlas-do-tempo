services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-local-development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      ATLAS_ENV: development
      DATABASE_URL: postgresql://atlas:atlas-local-development@db:5432/atlas
      PUBLIC_ORIGIN: http://127.0.0.1:8084
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
